name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - chore/*
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  SOLUTION: Fiap.TechChallenge.LambdaAuth.sln
  TEST_PROJECT: tests/Fiap.TechChallenge.LambdaAuth.Tests/Fiap.TechChallenge.LambdaAuth.Tests.csproj

jobs:
  build-test-analyze:
    name: Build, test and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Begin SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"SOAT-FIAP-2026_api-gateway-function"
          /o:"soat-fiap-2026"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=opencover"
          --results-directory TestResults

      - name: End SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
