name: CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: lambda-auth.zip
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_SECRET: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  package-and-deploy:
    name: Package and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Install Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Package
        working-directory: src/Fiap.TechChallenge.LambdaAuth
        run: >
          dotnet lambda package
          --configuration Release
          --framework net8.0
          --output-package ${{ github.workspace }}/${{ env.PACKAGE }}

      - name: Validar existência de credenciais AWS
        run: |
          if [ -z "${{ env.AWS_ACCESS_KEY_SECRET }}" ]; then
            echo "::error::Credenciais da AWS não encontradas nos secrets (ACCESS_KEY_ID ou AWS_ACCESS_KEY_ID)."
            exit 1
          fi
          echo "Credenciais da AWS encontradas nos secrets."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_ACCESS_KEY_SECRET }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Upload pacote para o S3
        run: |
          S3_BUCKET="${{ vars.LAMBDA_S3_BUCKET || 'soat-fiap-backend-tfstate' }}"
          S3_KEY="${{ vars.LAMBDA_S3_KEY || 'lambda/auth/lambda-auth.zip' }}"
          echo "Fazendo upload para s3://${S3_BUCKET}/${S3_KEY}..."
          aws s3 cp "${{ github.workspace }}/${{ env.PACKAGE }}" "s3://${S3_BUCKET}/${S3_KEY}"

      - name: Atualizar código da Lambda na AWS
        run: |
          FUNCTION_NAME="${{ vars.LAMBDA_FUNCTION_NAME || 'techchallenge-lambda-auth' }}"
          S3_BUCKET="${{ vars.LAMBDA_S3_BUCKET || 'soat-fiap-backend-tfstate' }}"
          S3_KEY="${{ vars.LAMBDA_S3_KEY || 'lambda/auth/lambda-auth.zip' }}"

          echo "Verificando se a função Lambda '$FUNCTION_NAME' está ativa na AWS..."
          if aws lambda get-function --function-name "$FUNCTION_NAME" > /dev/null 2>&1; then
            echo "Função encontrada. Atualizando código a partir do S3..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --s3-bucket "$S3_BUCKET" \
              --s3-key "$S3_KEY"

            echo "### Deploy Concluído" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Pacote:** Publicado em \`s3://${S3_BUCKET}/${S3_KEY}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Lambda:** Código da função \`${FUNCTION_NAME}\` atualizado com sucesso na AWS." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Função Lambda '$FUNCTION_NAME' não encontrada (infraestrutura efêmera está DOWN)."
            echo "### Pacote Publicado no S3" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Pacote:** Publicado com sucesso em \`s3://${S3_BUCKET}/${S3_KEY}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** A função \`${FUNCTION_NAME}\` não está ativa no momento (infra efêmera DOWN)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Próximo passo:** Quando a infraestrutura for provisionada via \`soat-infra\`, o Terraform carregará este pacote automaticamente do S3." >> "$GITHUB_STEP_SUMMARY"
          fi
