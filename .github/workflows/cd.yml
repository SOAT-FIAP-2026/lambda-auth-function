name: CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "infra/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: lambda-auth.zip

jobs:
  package-and-deploy:
    name: Package and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release --verbosity normal

      - name: Install Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Package
        working-directory: src/Fiap.TechChallenge.LambdaAuth
        run: >
          dotnet lambda package
          --configuration Release
          --framework net8.0
          --output-package ${{ github.workspace }}/${{ env.PACKAGE }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_package_path: ${{ github.workspace }}/${{ env.PACKAGE }}
          TF_VAR_db_connection_string: ${{ secrets.DB_CONNECTION_STRING }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_vpc_id: ${{ vars.VPC_ID }}
          # Lista JSON, ex.: ["subnet-aaa","subnet-bbb"]. Vazio publica a funcao fora da VPC.
          TF_VAR_subnet_ids: ${{ vars.SUBNET_IDS || '[]' }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'sa-east-1' }}
        run: |
          if [ -z "$TF_VAR_db_connection_string" ] || [ -z "$TF_VAR_jwt_secret" ]; then
            echo "Secrets DB_CONNECTION_STRING e JWT_SECRET precisam estar definidos no repositorio."
            exit 1
          fi
          terraform apply -auto-approve -input=false

      - name: Publicar endpoint no resumo do job
        working-directory: infra
        run: |
          echo "### Endpoint de autenticacao" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform output -raw auth_endpoint >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
